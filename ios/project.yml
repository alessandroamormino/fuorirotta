name: Fuorirotta
options:
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  DebugLocal: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 9A8MJ2Z4WB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    API_BASE_URL: https://fuori-rotta.it
  configs:
    Debug:
      APNS_ENVIRONMENT: sandbox
    DebugLocal:
      APNS_ENVIRONMENT: sandbox
    Release:
      APNS_ENVIRONMENT: production
packages:
  FuorirottaCore:
    path: Packages/FuorirottaCore
targets:
  Fuorirotta:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FuorirottaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.fuorirotta.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fuorirotta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FRAPIBaseURL: $(API_BASE_URL)
        FRApnsEnvironment: $(APNS_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: API locale (solo DebugLocal)
        basedOnDependencyAnalysis: false
        script: |
          # D-10: la base URL locale esiste solo nella configurazione DebugLocal, mai a runtime.
          if [ "$CONFIGURATION" = "DebugLocal" ]; then
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            HOST=$(scutil --get LocalHostName)
            /usr/libexec/PlistBuddy -c "Set :FRAPIBaseURL http://$HOST.local:3000" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Serve per collegarsi al server di sviluppo sul Mac.'" "$PLIST" 2>/dev/null || true
          fi
schemes:
  Fuorirotta:
    build:
      targets:
        Fuorirotta: all
    run:
      config: Debug
    archive:
      config: Release
  Fuorirotta Locale:
    build:
      targets:
        Fuorirotta: all
    run:
      config: DebugLocal
